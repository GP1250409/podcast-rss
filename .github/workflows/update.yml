name: update-rss

on:
  schedule:
    - cron: "0 22,4 * * *" # 北京时间 06:00 / 12:00
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate RSS
        env:
          SELF_URL: https://gp1250409.github.io/podcast-rss/ai-zaozhidao.xml
        run: python3 gen_rss.py 6a6e4a2ec654846ef0ee0795 ai-zaozhidao.xml
      - name: Commit
        run: |
          git config user.name "rss-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ai-zaozhidao.xml
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
